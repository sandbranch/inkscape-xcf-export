<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd"
     width="160mm" height="100mm" viewBox="0 0 160 100">
  <defs>
    <filter id="blur" x="-0.5" y="-0.5" width="2" height="2"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="clip"><circle cx="120" cy="50" r="25"/></clipPath>
  </defs>
  <g inkscape:groupmode="layer" id="La" inkscape:label="Source">
    <path id="star" d="M 30,10 L 38,35 L 62,35 L 43,50 L 50,75 L 30,60 L 10,75 L 17,50 L -2,35 L 22,35 Z" fill="#c22" stroke="#222" stroke-width="1.5"/>
  </g>
  <g inkscape:groupmode="layer" id="Lb" inkscape:label="Clone layer">
    <use xlink:href="#star" transform="translate(60,15) rotate(10)"/>
  </g>
  <g inkscape:groupmode="layer" id="Lc" inkscape:label="Blurred group layer" style="filter:url(#blur);opacity:0.8">
    <g inkscape:groupmode="layer" id="Lc1" inkscape:label="inner"><rect x="70" y="60" width="40" height="30" fill="#2a2"/></g>
    <text x="75" y="95" font-size="8" fill="#000">Text</text>
  </g>
  <g inkscape:groupmode="layer" id="Ld" inkscape:label="Clipped" clip-path="url(#clip)">
    <rect x="90" y="20" width="60" height="60" fill="#36c" fill-opacity="0.7"/>
  </g>
</svg>
